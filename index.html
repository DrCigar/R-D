<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Product R&amp;D Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
<style>
:root{
  --black:#000;--ink:#0F0F0F;--verm:#EF4023;--verm-soft:#FDE7E3;--gray:#EBEBEB;
  --bg:#F6F6F4;--card:#fff;--line:#E3E3E0;--muted:#6B6B68;--faint:#9A9A96;
  --s-prelaunch:#2563EB;--s-awaiting:#7C3AED;--s-testing:#D97706;--s-approved:#15803D;--s-hold:#6B7280;--s-rejected:#B91C1C;
  --ops:#0F766E;--sys:#4338CA;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 Figtree,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
img{max-width:100%}

/* header */
.top{background:var(--black);color:#fff;border-left:6px solid var(--verm)}
.top-in{max-width:1400px;margin:0 auto;padding:18px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.top img{height:30px;width:auto}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.top .sub{color:#B5B5B5;font-size:13px;margin-top:2px}
.top .grow{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:#ccc}
.who .dot{width:8px;height:8px;border-radius:50%;background:#22C55E;display:inline-block}
.who .dot.off{background:#F59E0B}
.btn{border:0;border-radius:10px;padding:9px 16px;font-weight:600;background:var(--verm);color:#fff;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:inherit;border:1px solid var(--line)}
.btn.ghost:hover{background:var(--gray)}
.top .btn.ghost{border-color:#444;color:#ddd}.top .btn.ghost:hover{background:#1a1a1a}
.btn.danger{background:transparent;color:var(--s-rejected);border:1px solid #F1C7C7}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.linkbtn{background:none;border:0;color:#ddd;text-decoration:underline;padding:0;font-size:13px}

.wrap{max-width:1400px;margin:0 auto;padding:22px 24px 60px}
.banner{background:#FFF7E6;border:1px solid #F3D9A4;color:#7A4B00;border-radius:10px;padding:10px 14px;margin-bottom:18px;font-size:13px}

/* status tiles */
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px;margin-bottom:18px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px 12px;text-align:left;position:relative;overflow:hidden;transition:transform .12s,box-shadow .12s}
.tile:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--c,var(--ink))}
.tile .n{font-size:28px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.tile .l{font-size:12.5px;color:var(--muted);font-weight:500;margin-top:2px}
.tile.on{border-color:var(--c,var(--ink));box-shadow:0 0 0 2px var(--c,var(--ink)) inset}

/* toolbar */
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.search{flex:1;min-width:200px;position:relative}
.search input{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px 10px 36px;outline:none}
.search input:focus{border-color:var(--ink)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.seg{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}

/* grid view */
.cat{margin-bottom:30px}
.cat-h{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.cat-h h2{margin:0;font-size:17px;font-weight:700}
.cat-h .c{color:var(--muted);font-size:13px}
.cat-h .mini{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.card{position:relative;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.card.def{border:2px solid var(--s-approved);box-shadow:0 0 0 3px color-mix(in srgb,var(--s-approved) 18%,transparent)}
.defbox{position:absolute;top:8px;right:8px;z-index:2;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:999px;padding:4px 11px 4px 5px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;transition:background .15s}
.defbox:hover{border-color:var(--ink);color:var(--ink)}
.defbox .ck{width:20px;height:20px;border:2px solid #b8b8b4;border-radius:6px;display:grid;place-items:center;background:#fff;color:transparent}
.defbox .ck svg{width:14px;height:14px}
.card.def .defbox{background:var(--s-approved);border-color:var(--s-approved);color:#fff;font-size:13px;padding:5px 14px 5px 5px}
.card.def .defbox .ck{width:34px;height:34px;border:0;border-radius:50%;color:var(--s-approved)}
.card.def .defbox .ck svg{width:24px;height:24px}
.dh .defbox{position:static;flex:none}
.dh .defbox.on{background:var(--s-approved);border-color:var(--s-approved);color:#fff}
.dh .defbox.on .ck{border:0;border-radius:50%;color:var(--s-approved)}
.mc .dchk{margin-left:auto;flex:none;width:24px;height:24px;border-radius:50%;background:var(--s-approved);color:#fff;display:grid;place-items:center}
.mc .dchk svg{width:15px;height:15px}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ph{aspect-ratio:16/10;background:linear-gradient(135deg,#F1F1EE,#E6E6E2);position:relative;display:grid;place-items:center;color:#B9B9B4;overflow:hidden}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:10px}
.ph .pill{position:absolute;top:10px;left:10px;z-index:1}
.ph .hint{position:absolute;bottom:8px;right:10px;font-size:11px;color:var(--faint)}
.cb{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1}
.cb .nm{font-weight:700;font-size:15px;line-height:1.25}
.cb .vd{color:var(--muted);font-size:12.5px;margin-top:2px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.facts div{padding:6px 8px;border-right:1px solid var(--line);min-width:0}
.facts div:last-child{border-right:0}
.facts .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
.facts .v{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.facts .v.na{color:var(--faint);font-weight:500}
.quotes{border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:12.5px}
.quotes .qh{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600;margin-bottom:2px}
.quotes .q{display:grid;grid-template-columns:1fr auto 64px;gap:8px;align-items:center;padding:3px 0;border-top:1px solid var(--gray)}
.quotes .qh + .q{border-top:0}
.quotes .q span small{display:block;font-size:11px;color:var(--faint);line-height:1.3;margin-top:1px}
.quotes .q b{font-weight:600}.quotes .q i{font-style:normal;font-size:11px;color:var(--faint);text-align:right}
.quotes .q.best b{color:var(--s-approved)}.quotes .q.best i{color:var(--s-approved);font-weight:700}
.qedit{display:grid;grid-template-columns:1fr 130px 34px;gap:6px 8px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--gray)}
.qedit [data-qf=note]{grid-column:1/3;font-size:12.5px}
.qedit input{border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;width:100%}
.qedit button{border:0;background:var(--gray);border-radius:8px;font-size:16px}
.demo{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.demo i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.demo.in i{background:var(--s-approved)}.demo.req i{background:var(--s-testing)}
.prog{margin-top:auto}
.segs{display:flex;gap:3px}
.segs span{flex:1;height:6px;border-radius:3px;background:var(--gray)}
.segs .pass{background:var(--s-approved)}.segs .active{background:var(--s-testing)}.segs .fail{background:var(--s-rejected)}
.prog .pl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px 3px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#fff;color:var(--c);border:1px solid color-mix(in srgb,var(--c) 35%,#fff);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.pill.solid{background:var(--c);color:#fff;border-color:var(--c)}.pill.solid::before{background:#fff}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:#EFEFEC;border-radius:12px;padding:10px;min-height:200px}
.col-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}
.col-h b{font-size:13px}
.col-h span{font-size:12px;color:var(--muted);font-weight:600}
.mc{background:#fff;border:1px solid var(--line);border-left:4px solid var(--c);border-radius:10px;padding:10px 11px;margin-bottom:8px;width:100%;text-align:left;display:flex;gap:10px;align-items:center}
.mc:hover{box-shadow:var(--shadow)}
.mc .th{width:44px;height:44px;border-radius:8px;background:#F1F1EE;flex:none;display:grid;place-items:center;color:#B9B9B4;overflow:hidden}
.mc .th{position:relative}.mc .th img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff}
.mc .t{font-weight:700;font-size:13px;line-height:1.25}
.mc .s{font-size:11.5px;color:var(--muted)}
.empty-col{font-size:12px;color:var(--faint);text-align:center;padding:20px 0}
.none{padding:50px 0;text-align:center;color:var(--muted)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;animation:fade .15s}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:#fff;z-index:21;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.15);animation:slide .18s ease-out}
@keyframes fade{from{opacity:0}}@keyframes slide{from{transform:translateX(30px);opacity:0}}
.dh{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.dh .grow{flex:1;min-width:0}
.dh h3{margin:0;font-size:19px;line-height:1.25}
.dh .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.x{border:0;background:var(--gray);border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1;flex:none}
.db{overflow-y:auto;padding:18px 20px 30px;flex:1}
.sec{margin-bottom:22px}
.sec h4{margin:0 0 10px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h4::before{content:"";width:3px;height:12px;background:var(--verm);border-radius:2px}
.photo-row{display:flex;gap:14px;align-items:flex-start}
.photo-box{width:180px;aspect-ratio:4/3;border-radius:12px;background:linear-gradient(135deg,#F1F1EE,#E6E6E2);display:grid;place-items:center;color:#B9B9B4;overflow:hidden;flex:none;border:1px solid var(--line)}
.gal{position:absolute;inset:0;background:#F4F4F2;touch-action:pan-y}
.gal img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .25s;padding:0!important;background:transparent!important}
.gal img.on{opacity:1}
.gnav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.92);box-shadow:0 1px 4px rgba(0,0,0,.25);display:grid;place-items:center;color:var(--ink);font-size:20px;line-height:1;padding:0}
.gnav:hover{background:#fff}.gnav.prev{left:8px}.gnav.next{right:8px}
.gcap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:18px 10px 7px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:11.5px;display:flex;justify-content:space-between;gap:8px;align-items:flex-end}
.gdots{display:flex;gap:4px;flex:none}.gdots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5)}.gdots i.on{background:#fff}
.photo-box .gnav{width:26px;height:26px;font-size:16px}.photo-box .gcap{font-size:10.5px;padding:14px 8px 5px}
.photo-box{position:relative}.photo-box img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:6px}
.attach{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.attach .fsz{font-size:12.5px;color:var(--muted)}
.photo-act{display:flex;flex-direction:column;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--muted)}
.drop{outline:2px dashed var(--verm);outline-offset:3px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;font-weight:600;color:var(--muted)}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff;outline:none;width:100%}
.f textarea{resize:vertical;min-height:70px}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--ink)}
.money{position:relative}.money span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted)}.money input{padding-left:22px}
.saved{font-size:12px;color:var(--s-approved);font-weight:600;opacity:0;transition:opacity .3s}
.saved.show{opacity:1}

.phase{border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:8px;display:grid;grid-template-columns:28px 1fr;gap:4px 10px}
.phase .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--gray);color:var(--muted)}
.phase.pass .num{background:var(--s-approved);color:#fff}.phase.active .num{background:var(--s-testing);color:#fff}.phase.fail .num{background:var(--s-rejected);color:#fff}
.phase .ttl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.phase .ttl b{font-size:14px}
.team{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:2px 7px;border-radius:5px;color:#fff;background:var(--ops)}
.team.sys{background:var(--sys)}.team.both{background:linear-gradient(90deg,var(--ops),var(--sys))}
.phase .desc{grid-column:2;font-size:12px;color:var(--muted)}
.phase .ctl{grid-column:2;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.chips{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.chips button{border:0;background:#fff;padding:5px 10px;font-size:12px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.chips button:last-child{border-right:0}
.chips button.on[data-v=todo]{background:var(--gray);color:var(--ink)}
.chips button.on[data-v=active]{background:var(--s-testing);color:#fff}
.chips button.on[data-v=pass]{background:var(--s-approved);color:#fff}
.chips button.on[data-v=fail]{background:var(--s-rejected);color:#fff}
.chips button.on[data-v=pending]{background:var(--gray);color:var(--ink)}
.chips button.on[data-v=approved]{background:var(--s-approved);color:#fff}
.chips button.on[data-v=hold]{background:var(--s-hold);color:#fff}
.chips button.on[data-v=rejected]{background:var(--s-rejected);color:#fff}
.phase .stamp{font-size:11.5px;color:var(--faint)}
.phase .note{grid-column:2;border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;width:100%;outline:none;margin-top:4px}
.phase .note:focus{border-color:var(--ink)}
.decision{background:#FAFAF8;border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.decision .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.notes .n{border-left:3px solid var(--gray);padding:4px 0 4px 12px;margin-bottom:12px}
.notes .n .h{font-size:12px;color:var(--muted)}.notes .n .h b{color:var(--ink)}
.notes .n p{margin:3px 0 0;white-space:pre-wrap}
.notes .n .del{background:none;border:0;color:var(--faint);font-size:12px;padding:0;margin-left:6px}
.addnote{display:flex;gap:8px;align-items:flex-end}
.addnote input{width:160px;border:1px solid var(--line);border-radius:9px;padding:8px 10px;outline:none;align-self:stretch}
.addnote textarea{flex:1;border:1px solid var(--line);border-radius:9px;padding:8px 10px;min-height:44px;resize:vertical;outline:none}
.df{padding:12px 20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}

/* modal */
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:rgba(0,0,0,.5);padding:16px}
.modal form{background:#fff;border-radius:16px;padding:24px;width:min(420px,100%);display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:0;font-size:19px}
.modal p{margin:0;color:var(--muted);font-size:13px}
.err{color:var(--s-rejected);font-size:13px;font-weight:600}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;z-index:40;box-shadow:var(--shadow)}

/* overview */
.hello{font-size:15px;color:var(--muted);margin:4px 0 20px;display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.hello b{color:var(--ink);font-size:26px;font-weight:800;letter-spacing:-.02em;margin-right:5px}
.ov{margin-bottom:36px}
.ov-h{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.ov-h h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em}
.ov-h span{color:var(--muted);font-size:13px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.shelf-card .ph{aspect-ratio:4/3}
.srow{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:auto}
.price{font-weight:800;font-size:18px;letter-spacing:-.01em}
.when{font-size:12px;color:var(--muted);white-space:nowrap}
.lanes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:900px){.lanes{grid-template-columns:1fr}}
.lane{background:#EFEFEC;border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:12px}
.lane-h{display:flex;justify-content:space-between;align-items:center;padding:2px 2px 0}
.lane-h b{font-size:12px;color:var(--muted);font-weight:600}
.lane-empty{font-size:12.5px;color:var(--faint);text-align:center;padding:18px 0}
.lab-card{display:grid;grid-template-columns:190px minmax(0,1fr);align-items:stretch}
.lab-card .ph{aspect-ratio:auto;height:auto;min-height:190px;background:#fff;border-right:1px solid var(--gray)}
@media (max-width:640px){.lab-card{grid-template-columns:1fr}.lab-card .ph{min-height:180px;border-right:0;border-bottom:1px solid var(--gray)}}
.lab-card .ph img{padding:10px}
.lab-card .cb{gap:8px;padding:12px 14px 14px}
.lab-card .signs{margin-top:auto}
.lab-card .nm{font-size:14px}
.lab-card .price{font-size:15px}
.nstep{font-size:12.5px;line-height:1.35;color:var(--ink);background:#F6F6F4;border-radius:8px;padding:6px 9px}
.nstep::before{content:"→ ";color:var(--verm);font-weight:800}
.signs{display:flex;flex-wrap:wrap;gap:6px}

.hist[open] summary::before{transform:rotate(90deg)}

.hrow{display:grid;grid-template-columns:40px minmax(0,1fr) auto 104px;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--gray);cursor:pointer}

        (p.doc ? '<button class="btn ghost sm" id="docOpen">Open ' + esc(p.doc.name) + '</button><span class="fsz">' + Math.max(1, Math.round(p.doc.size / 1024)).toLocaleString() + ' KB</span><button class="btn danger sm" id="docDel">Remove</button>' : '<span class="fsz">No file attached</span>') +
        '<label class="btn ghost sm">' + (p.doc ? 'Replace' : 'Attach file') + '<input type="file" id="docFile" hidden accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.csv,.txt"></label>' +
      '</div></div>' +
    '</div></div>' +
    '<div class="sec"><h4>Vendor prices</h4><div id="qrows">' + (p.quotes || []).map((q, i) => '<div class="qedit" data-qi="' + i + '"><input data-qf="vendor" placeholder="Vendor" value="' + esc(q.vendor) + '"><div class="money"><span>$</span><input data-qf="price" type="number" min="0" step="0.01" placeholder="Price" value="' + (q.price ?? '') + '"></div><button data-qdel="' + i + '" aria-label="Remove">×</button><input data-qf="note" placeholder="Note (bulk terms, stock on hand…)" value="' + esc(q.note) + '"></div>').join('') + '</div><button class="btn ghost sm" id="qadd">+ Add vendor price</button></div>' +
    '<div class="sec"><h4>Demo unit</h4><div class="fields">' + sel('demoStatus', 'Status', DEMO) +
      fld('demoDate', 'Date received', 'type="date"') + fld('demoQty', 'Units in house', 'placeholder="e.g. 2"') + '</div></div>' +
    '<div class="sec"><h4>Pros and cons</h4><div class="fields">' +
      '<div class="f"><label for="f-pros">Pros (one per line)</label><textarea id="f-pros" data-k="pros" data-list>' + esc((p.pros || []).join('\n')) + '</textarea></div>' +
      '<div class="f"><label for="f-cons">Cons (one per line)</label><textarea id="f-cons" data-k="cons" data-list>' + esc((p.cons || []).join('\n')) + '</textarea></div></div></div>' +
    '<div class="sec"><details class="ckl"' + (ckOpen ? ' open' : '') + '><summary><h4>Testing checklist (optional) · ' + passed(p) + ' of ' + PHASES.length + ' passed</h4></summary>' + PHASES.map((ph, i) => {
      const s = p.phases?.[ph.k] || {}; const v = s.s || 'todo';
      return '<div class="phase ' + v + '"><div class="num">' + (v === 'pass' ? '✓' : v === 'fail' ? '!' : i + 1) + '</div>' +
        '<div class="ttl"><b>' + ph.t + '</b><span class="team ' + ph.team + '">' + TEAM[ph.team] + '</span></div>' +
        '<div class="desc">' + ph.d + '</div>' +
        '<div class="ctl"><div class="chips" data-phase="' + ph.k + '">' + [['todo', 'To do'], ['active', 'In progress'], ['pass', 'Passed'], ['fail', 'Failed']].map(([k, t]) => '<button data-v="' + k + '" class="' + (v === k ? 'on' : '') + '">' + t + '</button>').join('') + '</div>' +
        (s.by || s.date ? '<span class="stamp">' + esc([s.by, fmtDate(s.date)].filter(Boolean).join(' · ')) + '</span>' : '') + '</div>' +
        '<input class="note" data-pnote="' + ph.k + '" placeholder="Result or blocker…" value="' + esc(s.note) + '"></div>';
    }).join('') + '</details></div>' +
    '<div class="sec notes"><h4>Notes and updates</h4><div class="addnote"><input id="noteName" placeholder="Your name (optional)" value="' + esc(ls.get(NAME_KEY, '')) + '"><textarea id="noteText" placeholder="Share a test result, question or update…"></textarea><button class="btn sm" id="noteAdd">Post</button></div><div style="height:14px"></div>' +
      (notes.map(n => '<div class="n"><div class="h"><b>' + esc(n.by) + '</b> · ' + new Date(n.at).toLocaleString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) +
        (n.by === me() ? '<button class="del" data-delnote="' + esc(n.id) + '">Delete</button>' : '') + '</div><p>' + esc(n.text) + '</p></div>').join('') || '<div style="color:var(--faint);font-size:13px">No notes yet.</div>') +
    '</div></div>' +
    '<div class="df"><button class="btn danger sm" id="delProduct">Delete product</button><span style="font-size:12px;color:var(--faint)">Added by ' + esc(p.createdBy || '—') + '</span></div></aside>';
  $('#drawerHost .db').scrollTop = keepScroll;
  if (keepScroll) $('#drawerHost .drawer').style.animation = 'none';
  hydratePhotos($('#drawerHost'));
  wireDrawer(p);
}
function flashSaved() { const s = $('#saved'); if (!s) return; s.classList.add('show'); clearTimeout(flashSaved.h); flashSaved.h = setTimeout(() => s.classList.remove('show'), 1200); }
async function patch(p, part, rerender = true) {
  Object.assign(p, part);
  try { await db.patch('products', p.id, part); flashSaved(); } catch (e) { if (e.message !== 'auth') toast(e.message); }
  render(); if (rerender) renderDrawer();
}
function wireDrawer(p) {
  const host = $('#drawerHost');
  host.querySelectorAll('[data-close]').forEach(b => b.onclick = closeDrawer);
  // vendor prices: edit in place, saved as the whole list
  const readQuotes = () => [...host.querySelectorAll('.qedit')].map(r => { const v = r.querySelector('[data-qf=vendor]').value.trim(), pr = r.querySelector('[data-qf=price]').value; return { vendor: v, price: pr === '' ? null : Number(pr), note: r.querySelector('[data-qf=note]').value.trim() }; });
  host.querySelectorAll('.qedit input').forEach(inp => inp.addEventListener('change', () => patch(p, { quotes: readQuotes() }, false)));
  host.querySelectorAll('[data-qdel]').forEach(b => b.onclick = () => { const qs = readQuotes(); qs.splice(+b.dataset.qdel, 1); patch(p, { quotes: qs }); });
  $('#qadd').onclick = () => { patch(p, { quotes: [...readQuotes(), { vendor: '', price: null }] }); setTimeout(() => { const rows = host.querySelectorAll('.qedit'); rows[rows.length - 1]?.querySelector('input')?.focus(); }, 30); };
  host.querySelectorAll('[data-k]').forEach(inp => inp.addEventListener('change', () => {
    const k = inp.dataset.k; let v = inp.value;
    if (k === 'cost') v = v === '' ? null : Number(v);
    else if (inp.hasAttribute('data-list')) v = v.split('\n').map(s => s.trim()).filter(Boolean);
    else v = v.trim();
    if (k === 'name' && !v) { inp.value = p.name; return; }
    patch(p, { [k]: v }, ['name', 'category', 'vendor', 'availability', 'demoStatus', 'photoUrl', 'docUrl'].includes(k));
  }));
  host.querySelectorAll('[data-phase] button').forEach(b => b.onclick = () => {
    const k = b.closest('[data-phase]').dataset.phase;
    const phases = { ...(p.phases || {}) };
    phases[k] = { ...(phases[k] || {}), s: b.dataset.v, by: me(), date: today() };
    if (b.dataset.v === 'todo') { delete phases[k].by; delete phases[k].date; }
    patch(p, { phases });
  });
  host.querySelectorAll('[data-pnote]').forEach(inp => inp.addEventListener('change', () => {
    const k = inp.dataset.pnote; const phases = { ...(p.phases || {}) };
    phases[k] = { ...(phases[k] || { s: 'todo' }), note: inp.value.trim() };
    patch(p, { phases }, false);
  }));
  host.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => {
    const v = b.dataset.dec;
    patch(p, v === 'pending' ? { decision: 'pending', decisionDate: '', decisionBy: '', signoffs: {} } : { decision: v, decisionDate: today(), decisionBy: me() });
  });
  const ck = host.querySelector('details.ckl'); if (ck) ck.ontoggle = () => { ckOpen = ck.open; };
  $('#noteAdd').onclick = async () => {
    const text = $('#noteText').value.trim(); if (!text) return;
    ls.set(NAME_KEY, $('#noteName').value.trim());
    const n = { id: 'n' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), product: p.id, by: me(), at: Date.now(), text };
    S.notes.push(n);
    try { await db.put('notes', n.id, n); } catch (e) { S.notes.pop(); if (e.message !== 'auth') toast(e.message); }
    renderDrawer();
  };
  host.querySelectorAll('[data-delnote]').forEach(b => b.onclick = async () => {
    const id = b.dataset.delnote; S.notes = S.notes.filter(n => n.id !== id);
    await db.del('notes', id).catch(e => toast(e.message)); renderDrawer();
  });
  $('#delProduct').onclick = async () => {
    if (!confirm('Delete ' + p.name + ' and its notes? This can’t be undone.')) return;
    S.products = S.products.filter(x => x.id !== p.id); S.notes = S.notes.filter(n => n.product !== p.id);
    if (S.mode === 'preview') delete S.photos[p.id];
    await db.del('products', p.id).catch(e => toast(e.message)); closeDrawer(); render();
  };
  // photo upload / drop
  const box = $('#photoBox');
  const take = f => f && f.type.startsWith('image/') && setPhoto(p, f);
  $('#photoFile').onchange = e => take(e.target.files[0]);
  box.ondragover = e => { e.preventDefault(); box.classList.add('drop'); };
  box.ondragleave = () => box.classList.remove('drop');
  box.ondrop = e => { e.preventDefault(); box.classList.remove('drop'); take(e.dataTransfer.files[0]); };
  // attached file (PDF, spec sheet...), one per product
  $('#docFile').onchange = e => { const f = e.target.files[0]; if (f) setDoc(p, f); };
  const dOpen = $('#docOpen'); if (dOpen) dOpen.onclick = () => openDoc(p);
  const dDel = $('#docDel'); if (dDel) dDel.onclick = async () => {
    if (!confirm('Remove ' + p.doc.name + '?')) return;
    await db.del('docs', p.id).catch(() => {}); patch(p, { doc: null });
  };
  const pd = $('#photoDel'); if (pd) pd.onclick = async () => {
    if (p.photo) await db.del('photos', p.id).catch(() => {});
    patch(p, { photo: null, photoUrl: '' });
  };
}
function shrink(file, max = 720) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .82));
    };
    img.onerror = () => rej(new Error('Couldn’t read that image'));
    img.src = url;
  });
}
async function setDoc(p, file) {
  if (file.size > MAX_DOC) return toast('Files up to 3 MB. That one is ' + (file.size / 1048576).toFixed(1) + ' MB.');
  try {
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(new Error('Couldn’t read that file')); r.readAsDataURL(file); });
    toast('Uploading ' + file.name + '…');
    await db.put('docs', p.id, { name: file.name, type: file.type, data });
    await patch(p, { doc: { name: file.name, size: file.size, rev: Date.now(), by: me() } });
    toast('Attached ' + file.name);
  } catch (e) { if (e.message !== 'auth') toast(e.message); }
}
async function openDoc(p) {
  const w = window.open('', '_blank'); // open now so the popup isn't blocked after the download
  try {
    const f = await db.file('docs', p.id); if (!f?.data) throw new Error('That file is no longer there.');
    const blob = await (await fetch(f.data)).blob(), url = URL.createObjectURL(blob);
    if (w) w.location = url; else { const a = document.createElement('a'); a.href = url; a.download = f.name; a.click(); }
  } catch (e) { if (w) w.close(); if (e.message !== 'auth') toast(e.message); }
}
async function setPhoto(p, file) {
  try {
    const data = await shrink(file); const rev = Date.now();
    await db.put('photos', p.id, { data });
    S.photos[p.id + ':' + rev] = data;
    await patch(p, { photo: { rev }, photoUrl: '' });
  } catch (e) { if (e.message !== 'auth') toast(e.message); }
}

/* ---------- add product ---------- */
$('#addBtn').onclick = async () => {
  if (S.mode === 'rest' && !S.auth) return showSignin('');
  const name = prompt('Product name'); if (!name || !name.trim()) return;
  const id = name.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) + '-' + Math.random().toString(36).slice(2, 6);
  const p = { id, name: name.trim(), category: '', vendor: '', cost: null, costNote: '', leadTime: '', moq: '', availability: 'now', launch: '',
    pros: [], cons: [], demoStatus: 'none', demoDate: '', demoQty: '', decision: 'pending', decisionDate: '', decisionBy: '', phases: {}, photo: null, photoUrl: '',
    order: Date.now(), createdAt: Date.now(), createdBy: me() };
  S.products.push(p);
  try { await db.put('products', id, p); } catch (e) { S.products.pop(); if (e.message !== 'auth') toast(e.message); return; }
  render(); openDrawer(id); setTimeout(() => $('#f-category')?.focus(), 50);
};

/* ---------- events ---------- */
$('#viewSeg').onclick = e => { const b = e.target.closest('button'); if (!b) return; view = b.dataset.v; ls.set(VIEW_KEY, view); render(); };
$('#q').oninput = render;
function toggleDefault(id) {
  const p = S.products.find(x => x.id === id); if (!p) return;
  patch(p, { isDefault: !p.isDefault }, !!openId);
}
// Sign-offs: SC Ops, Systems and C-Suite; the last one approves the product (with a stamp) and moves it to "Just approved".
async function signOff(id, team) {
  const p = S.products.find(x => x.id === id); if (!p) return;
  const so = { ...(p.signoffs || {}) };
  if (so[team]) {
    if (!confirm('Undo the ' + TEAMS[team] + ' sign-off for ' + p.name + '?')) return;
    so[team] = null;
    return patch(p, statusOf(p) === 'approved' ? { signoffs: so, decision: 'pending', decisionDate: '', decisionBy: '' } : { signoffs: so }, !!openId);
  }
  so[team] = { by: me(), date: today() };
  const part = { signoffs: so };
  if (TEAM_KEYS.every(t => so[t])) {
    Object.assign(part, { decision: 'approved', decisionDate: today(), decisionBy: TEAM_KEYS.map(t => TEAMS[t] + ': ' + so[t].by).join(' · ') });
    document.querySelectorAll('.card[data-open="' + CSS.escape(id) + '"]').forEach(c => c.insertAdjacentHTML('beforeend', '<div class="approve-stamp"><span>APPROVED</span></div>'));
    await new Promise(r => setTimeout(r, 1100));
    toast(p.name + ' approved');
  }
  patch(p, part, !!openId);
}
document.addEventListener('click', e => { const s = e.target.closest('[data-sign]'); if (!s) return; e.stopPropagation(); signOff(s.dataset.pid, s.dataset.sign); }, true);
// Demo unit checkbox on lab cards: ticking it moves the product from Coming soon to Testing
const demoBox = p => { const on = p.demoStatus === 'inhouse';
  return '<button class="demobox' + (on ? ' on' : '') + '" data-demo="' + esc(p.id) + '" role="checkbox" aria-checked="' + on + '"><span class="ck">' + CHECK + '</span>Demo unit in house' + (on && p.demoDate ? '<small>since ' + fmtDate(p.demoDate) + '</small>' : '') + '</button>'; };
function toggleDemo(id) {
  const p = S.products.find(x => x.id === id); if (!p) return;
  patch(p, p.demoStatus === 'inhouse' ? { demoStatus: 'none', demoDate: '' } : { demoStatus: 'inhouse', demoDate: p.demoDate || today() }, !!openId);
}
document.addEventListener('click', e => { const d = e.target.closest('[data-demo]'); if (!d) return; e.stopPropagation(); toggleDemo(d.dataset.demo); }, true);
document.addEventListener('toggle', e => { if (e.target.matches?.('details.hist')) S.histOpen = e.target.open; }, true);
$('#view').onclick = e => {
  const d = e.target.closest('[data-def]'); if (d) { e.stopPropagation(); return toggleDefault(d.dataset.def); }
  const c = e.target.closest('[data-open]'); if (c) openDrawer(c.dataset.open);
};
$('#view').onkeydown = e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.card, .hrow')) { e.preventDefault(); openDrawer(e.target.dataset.open); } };
$('#drawerHost').addEventListener('click', e => { const d = e.target.closest('[data-def]'); if (d) toggleDefault(d.dataset.def); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && openId) closeDrawer(); });

boot();
})();
</script>
